# ============================================================
#  服务导航 · 站点配置 (YAML) — 占位示例数据
# ------------------------------------------------------------
#  这是应用默认读取的配置文件。新增 / 修改服务后，
#  在页面底部点「重新加载配置」即可生效（无需重启）。
#
#  ⚠️ 本文件为公开演示用的占位数据，不含任何真实主机地址、
#     域名或凭证。请根据你的实际环境替换下方内容。
#
#  支持的字段：
#    name        服务名称（必填）
#    description 一句话说明
#    category    分类名（决定卡片分组）
#    scope       internal(内网) | external(外网) | both(通用)
#    type        link(可点击) | info(仅展示端口，不可点击)
#    url         可点击链接（link 类型必填）
#    icon        emoji 图标
#    host        主机地址（info 卡用，如 10.0.0.1）
#    ports       端口清单，如 ["22 / SSH", "3389 / RDP"]
#    status      online(在线) | closed(已关闭) | unknown(未知)
#    note        备注
#
#  想用 JSON / Markdown 也可：把本文件删掉或改名，
#  应用会自动改读同目录下的 sites.json 或 sites.md。
# ============================================================

